<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="GamingStrom - Web Developer Portfolio">
    <meta name="author" content="GamingStrom">

    <title>GamingStrom | Web Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --bg: #07090d;
            --card: #10141b;
            --card2: #151a22;
            --text: #ffffff;
            --muted: #9aa4b2;
            --accent: #00e5ff;
            --border: rgba(255,255,255,0.09);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* BACKGROUND */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(0,229,255,0.07);
            filter: blur(100px);
            border-radius: 50%;
            top: -200px;
            left: -200px;
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(0,119,255,0.05);
            filter: blur(100px);
            border-radius: 50%;
            right: -250px;
            bottom: -200px;
            pointer-events: none;
            z-index: -1;
        }

        /* NAVBAR */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
            background: rgba(7,9,13,0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav ul a:hover {
            color: var(--accent);
        }

        /* HERO */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 50px;
        }

        .hero-content {
            max-width: 850px;
        }

        .small-title {
            color: var(--accent);
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 75px);
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero-description {
            color: var(--muted);
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 13px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .primary {
            background: var(--accent);
            color: #001014;
        }

        .primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,229,255,0.2);
        }

        .secondary {
            color: white;
            border: 1px solid var(--border);
            background: var(--card);
        }

        .secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* GENERAL */

        section {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 90px 25px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .section-title p {
            color: var(--muted);
        }

        /* ABOUT */

        .about-box {
            max-width: 850px;
            margin: auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        .about-box p {
            color: #b7c0cb;
            font-size: 17px;
            margin-bottom: 15px;
        }
